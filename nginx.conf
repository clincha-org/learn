server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'";

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
